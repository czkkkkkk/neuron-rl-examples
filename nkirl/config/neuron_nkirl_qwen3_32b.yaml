# NKIRL with Qwen3-32B on 8 Trainium2 nodes: 1 actor node (64 cores, TorchTitan) and 7 rollout nodes
# (56 vLLM-Neuron replicas at TP=8), with the v1 separate_async trainer and NIXL weight sync.
#
# Recipe: 64 prompts x 8 samples, prompt 6,144 + response 10,240 tokens, 3 tool turns, GRPO, no KL.
#   * training: TorchTitan, TP=8 x SP x FSDP=8 (with the plugin's tp8_fsdp8 core order), full activation
#     checkpointing, unfused q/k/v, Adam moments on the host outside the optimizer step;
#   * rollout: vLLM-Neuron through the plugin's server, with one token bucket of 16,384.
defaults:
  - ppo_trainer
  - override model_engine: torchtitan
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

data:
  # run_nkirl.sh sets model.path and both data files from MODEL_DIR / DATA_DIR on the command line.
  train_files: ${oc.env:DATA_DIR}/train_hermes.parquet
  val_files: ${oc.env:DATA_DIR}/val_hermes.parquet
  prompt_key: prompt
  train_batch_size: 64
  max_prompt_length: 6144
  max_response_length: 10240
  shuffle: false
  truncation: error
  filter_overlong_prompts: true
  return_raw_chat: true
  dataloader_num_workers: 0
  apply_chat_template_kwargs:
    enable_thinking: false

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

actor_rollout_ref:
  hybrid_engine: false
  model:
    path: ${oc.env:MODEL_DIR}
    use_remove_padding: false
    use_fused_kernels: false
  actor:
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    use_kl_loss: false
    entropy_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    optim:
      lr: 1.0e-6
    torchtitan:
      _target_: verl_hardware_plugin.accelerators.neuron.engines.config.NeuronTorchtitanEngineConfig
      attn_type: sdpa
      spmd_backend: default
      dtype: bfloat16
      use_remove_padding: false
      activation_checkpoint: full
      # prompt + response; a multiple of 512.
      max_seq_len: 16384
      # TP=8 x FSDP=8 needs VERL_NEURON_ACTOR_CORE_ORDER=tp8_fsdp8 (set by run_nkirl.sh).
      tensor_parallel_size: 8
      data_parallel_size: 1
      data_parallel_replicate_size: 1
      data_parallel_shard_size: 8
      param_offload: false
      optimizer_offload: true
      enable_sequence_parallel: true
      fuse_qkv: false
  rollout:
    name: vllm
    nnodes: 7
    n_gpus_per_node: 64
    tensor_model_parallel_size: 8
    dtype: bfloat16
    load_format: auto
    n: 8
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    prompt_length: 6144
    response_length: 10240
    max_model_len: 16384
    max_num_batched_tokens: 16384
    max_num_seqs: 8
    calculate_log_probs: false
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    enable_sleep_mode: false
    free_cache_engine: false
    enable_prefix_caching: false
    enable_chunked_prefill: false
    multi_turn:
      enable: true
      max_assistant_turns: 3
      max_user_turns: 3
      max_parallel_calls: 1
      max_tool_response_length: 2048
      tool_config_path: /workspace/nkirl/config/profile_kernel_tool.yaml
      # General Qwen3 emits Hermes JSON tool calls; nkirl_reward.py rewrites them to the XML form the
      # scoring core reads (NKIRL_TOOL_FORMAT=hermes).
      format: hermes
    checkpoint_engine:
      backend: neuron_nixl
      custom_backend_module: verl_hardware_plugin.accelerators.neuron.weight_sync.checkpoint_engine
      update_weights_bucket_megabytes: 512
      engine_kwargs:
        neuron_nixl:
          timeout_s: 7200  # covers a whole sync, including the first sync's graph compiles
          whole_params: true

reward:
  custom_reward_function:
    path: /workspace/nkirl/nkirl_reward.py
    name: compute_score

trainer:
  device: neuron
  use_v1: true
  nnodes: 1
  n_gpus_per_node: 64
  total_epochs: 1
  total_training_steps: 4
  project_name: neuron_nkirl
  experiment_name: qwen3_32b_1p7
  logger: [console, file]
  val_before_train: false
  test_freq: -1
  save_freq: -1
  resume_mode: disable
  v1:
    trainer_mode: separate_async
    separate_async:
      # train_batch_size / ppo_mini_batch_size
      parameter_sync_step: 4
      num_warmup_batches: 1
