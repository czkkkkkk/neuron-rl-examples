data:
  train_files: ${oc.env:DATA_DIR}/train.parquet
  val_files: ${oc.env:DATA_DIR}/test.parquet
  val_max_samples: 8
  train_batch_size: 16
  max_prompt_length: 256
  max_response_length: 256
  filter_overlong_prompts: true
  dataloader_num_workers: 0
  apply_chat_template_kwargs:
    enable_thinking: false

algorithm:
  adv_estimator: grpo

actor_rollout_ref:
  hybrid_engine: false
  model:
    path: ${oc.env:MODEL_DIR}
    use_remove_padding: false
    use_fused_kernels: false
  actor:
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    use_kl_loss: false
    kl_loss_coef: 0.001
    optim:
      lr: 1.0e-6
    torchtitan: &neuron_engine
      _target_: verl_hardware_plugin.accelerators.neuron.engines.config.NeuronTorchtitanEngineConfig
      attn_type: sdpa
      spmd_backend: default
      dtype: bfloat16
      use_remove_padding: false
      activation_checkpoint: full
      use_torch_compile: true
      max_seq_len: 512
      tensor_parallel_size: 4
      data_parallel_size: 8
      data_parallel_replicate_size: 1
      data_parallel_shard_size: 8
      weight_sync_shared_host_bucket: true
      weight_sync_cpu_gather_threshold_bytes: 536870912
      param_offload: false
      optimizer_offload: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    torchtitan:
      <<: *neuron_engine
      forward_only: true
  rollout:
    name: vllm
    nnodes: 1
    n_gpus_per_node: 32
    tensor_model_parallel_size: 8
    dtype: bfloat16
    load_format: auto
    n: 2
    temperature: 1.0
    # The V2 device sampler considers at most 256 candidates. Make that policy explicit.
    top_k: 256
    top_p: 1.0
    max_model_len: 512
    max_num_batched_tokens: 512
    max_num_seqs: 8
    calculate_log_probs: false
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    enable_sleep_mode: false
    free_cache_engine: false
    enable_prefix_caching: false
    # Each recipe has a prefill bucket large enough for a complete request.
    enable_chunked_prefill: false
    engine_kwargs:
      vllm:
        logprobs_mode: raw_logprobs
        additional_config:
          neuron_config:
            num_batched_tokens_buckets: [512]
            num_seqs_buckets: [1, 2, 4, 8]
    agent:
      num_workers: 2
    checkpoint_engine:
      backend: neuron_nixl
      custom_backend_module: verl_hardware_plugin.accelerators.neuron.weight_sync.checkpoint_engine
      update_weights_bucket_megabytes: 128

reward:
  num_workers: 1

trainer:
  device: neuron
  use_v1: true
  nnodes: 1
  n_gpus_per_node: 32
  total_epochs: 15
  total_training_steps: 3
  project_name: neuron_gsm8k
  experiment_name: qwen38_27b_sdk2331
  logger: [console]
  val_before_train: false
  test_freq: -1
  save_freq: -1
  resume_mode: disable
  v1:
    trainer_mode: separate_async
    separate_async:
      parameter_sync_step: 1
